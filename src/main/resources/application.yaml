server:
  port: 8081
spring:
  application:
    name: shifu
  config:
    # 本地密钥文件，不纳入版本控制；缺失时按可选处理，不影响启动
    import: optional:file:./config/application-secret.yaml
  # 客服助手：走 DeepSeek 的 OpenAI 兼容接口，换模型只需改 base-url 与 model
  ai:
    openai:
      # 占位值用于保证未配置密钥时应用仍能启动，此时助手自动降级为规则应答
      api-key: ${DEEPSEEK_API_KEY:disabled}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.3
          # 单次回答的 token 上限，控制成本
          max-tokens: ${ASSISTANT_MAX_TOKENS:800}
          # 流式响应末尾附带用量，便于统计开销
          stream-usage: true
  datasource:
    # MySQL 8 驱动类（原 com.mysql.jdbc.Driver 已废弃）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shifu?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    # 冒号后是本机开发的默认值，部署到其他环境时用环境变量覆盖即可
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
  # Spring Boot 3 起 Redis 配置前缀由 spring.redis 改为 spring.data.redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123321}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.shifu.entity # 别名扫描包
logging:
  level:
    com.shifu: debug
  pattern:
    dateformat: mm:ss.SSS

# RocketMQ：秒杀订单消息队列
shifu:
  # 图片上传目录：指向 nginx 的静态资源目录，前端通过 /imgs/ 访问
  # 默认值是本机部署路径，换机器用环境变量 SHIFU_UPLOAD_DIR 覆盖
  upload:
    dir: ${SHIFU_UPLOAD_DIR:D:/java/Java demo/ShiFu/nginx-1.18.0/html/shifu/imgs/}
  rocketmq:
    # RocketMQ 部署在 Windows 本机（D:\rocketmq）
    # 若以后换成虚拟机/服务器部署，改成对应 IP 即可，例如 192.168.100.130:9876
    name-server: 127.0.0.1:9876
    producer-group: benefit-order-producer
    consumer-group: benefit-order-consumer
    topic: benefit-order-topic
    # 笔记发布事件：粉丝收件箱异步推送
    feed:
      producer-group: note-feed-producer
      consumer-group: note-feed-consumer
      topic: note-feed-topic
  # 客服助手
  assistant:
    enabled: ${ASSISTANT_ENABLED:true}
    # 单个用户每窗口期最多提问次数，防止刷量消耗模型额度
    rate-limit:
      max-requests: 20
      window: 10m
    # 会话记忆：保留最近消息条数与会话过期时间
    memory:
      max-messages: 20
      ttl: 2h
